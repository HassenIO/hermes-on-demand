# Firecrawl-compatible stack for Hermes on small VPS hosts.
#
# Default profile "lite": lightweight scraper implementing /v2/scrape + /v2/search
# Full profile "full": official Firecrawl images (needs ~4GB+ RAM — OOM on 1–2GB VPS)
#
# Hermes:
#   FIRECRAWL_API_URL=http://127.0.0.1:3002
#   web.backend: firecrawl
#
# Start lite (default):
#   docker compose up -d --build
# Start official Firecrawl (large VPS only):
#   docker compose --profile full up -d

name: firecrawl

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── SearXNG: reliable web_search from VPS IPs (Hermes search_backend) ─
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    cpus: 0.5
    mem_limit: 384m
    logging: *default-logging

  # ── Default: lite Firecrawl-compatible API (extract / scrape) ───────
  lite:
    build: ./lite
    image: hermes-firecrawl-lite:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      # Prefer in-compose SearXNG for /v2/search fallback
      - SEARXNG_INTERNAL_URL=http://searxng:8080
    depends_on:
      - searxng
    cpus: 0.5
    mem_limit: 384m
    logging: *default-logging

  # ── Optional: full upstream Firecrawl (profile: full) ───────────────
  playwright-service:
    profiles: ["full"]
    image: ghcr.io/firecrawl/playwright-service:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "2"
    networks:
      - backend
    cpus: 0.5
    mem_limit: 768m
    logging: *default-logging

  api:
    profiles: ["full"]
    image: ghcr.io/firecrawl/firecrawl:latest
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: "1"
      CRAWL_CONCURRENT_REQUESTS: "1"
      MAX_CONCURRENT_JOBS: "1"
      BROWSER_POOL_SIZE: "1"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: "120000"
      ENV: local
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_started
    ports:
      - "127.0.0.1:3002:3002"
    command: node dist/src/harness.js --start-docker
    networks:
      - backend
    cpus: 1.0
    mem_limit: 2048m
    logging: *default-logging

  redis:
    profiles: ["full"]
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0 --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - backend
    mem_limit: 160m
    logging: *default-logging

  rabbitmq:
    profiles: ["full"]
    image: rabbitmq:3-alpine
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 256m
    logging: *default-logging

  nuq-postgres:
    profiles: ["full"]
    image: ghcr.io/firecrawl/nuq-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - backend
    volumes:
      - firecrawl-pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    logging: *default-logging

networks:
  backend:

volumes:
  firecrawl-pgdata:
